[theme]
base = "light"
primaryColor = "#ed2939"
backgroundColor = "#faf9f7"
secondaryBackgroundColor = "#f3f2f0"
textColor = "#202126"
font = "sans serif"

[server]
headless = true
maxUploadSize = 1
# Deploy updates with a full reboot; avoid module-reload races during imports.
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false
